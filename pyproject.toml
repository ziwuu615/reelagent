[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reelagent"
version = "1.0.0"
description = "ReelAgent — AI 短视频创作 Agent 平台：从一句话到成片的多智能体生产线"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ReelAgent Team" }]
keywords = ["ai", "video-generation", "agent", "llm", "multimodal", "saas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # --- 引擎 ---
    "numpy>=1.24",
    "Pillow>=10.0",
    # --- 配置与校验 ---
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    # --- Web / API ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # --- 持久化 ---
    "SQLAlchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    # --- 缓存 / 队列 ---
    "redis>=5.0",
    # --- 计费 ---
    "stripe>=8.0",
    # --- 安全 ---
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
    "cryptography>=42.0",
    "email-validator>=2.1",
    # --- 可靠性 ---
    "tenacity>=8.2",
    # --- 可观测 ---
    "structlog>=24.1",
    "prometheus-client>=0.20",
    # --- CLI ---
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
s3 = ["aioboto3>=13.0"]
sentry = ["sentry-sdk>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://reelagent.example.com"
Documentation = "https://reelagent.example.com/docs"
Changelog = "https://github.com/reelagent/reel-agent/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/reelagent/reel-agent/issues"

[project.scripts]
reelagent = "reelagent.cli:main"
reelagent-server = "reelagent_cloud.server:main"
reelagent-worker = "reelagent_cloud.worker:main"
reelagent-admin = "reelagent_cloud.admin:main"

[tool.setuptools.packages.find]
include = ["reelagent*", "reelagent_cloud*"]

[tool.setuptools.package-data]
reelagent_cloud = ["web/templates/**/*.html", "web/static/**/*"]

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: 纯单元测试，无 IO",
    "integration: 需要数据库/存储等依赖",
    "contract: 校验第三方 API 契约（用 respx 录制回放）",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["reelagent", "reelagent_cloud"]
omit = ["*/migrations/*", "*/web/templates/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["reelagent", "reelagent_cloud", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501",    # 行长由 formatter 控制
    "S101",    # 测试里允许 assert
    "B008",    # FastAPI 依赖注入惯用默认参数
    "SIM108",  # 三元表达式并非总是更清晰
    # RUF001/002/003 是「字符串里的易混淆 Unicode 字符」检查，默认针对
    # 西文标点。本项目所有面向用户的文案与注释都是中文，全角标点（，。：；「」）
    # 是正确用法而非笔误——开启这三条会产生上千条噪声，把真问题淹没。
    "RUF001",
    "RUF002",
    "RUF003",
    # N818 要求异常名以 Error 结尾。本项目采用 API 风格的异常命名
    # （NotFound / Forbidden / PaymentRequired），与 FastAPI 的 HTTPException、
    # Django 的 Http404 一致：raise 处的可读性比后缀规范更重要。
    # 对外的稳定标识由 AppError.code 提供，不依赖类名。
    "N818",
    # S311：重试退避的抖动不需要密码学随机数，用 random 是正确选择。
    "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
# 供应商适配器与 LLM 客户端要按运行时配置的 base_url 发请求，
# URL 来自运维配置而非用户输入，S310（URL scheme 审计）在此不适用。
"reelagent/providers/*" = ["S310"]
"reelagent/llm/openai_compat.py" = ["S310"]
"reelagent_cloud/db/migrations/versions/*" = ["E", "F", "I", "N", "UP", "SIM", "B", "W"]
"scripts/*" = ["S", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["reelagent", "reelagent_cloud"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["reelagent_cloud/db/migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
