# ============================================================================
# ReelAgent 本地开发编排（只起依赖，不起应用）
#
# 定位：**基础设施专用**。Python 代码在宿主机裸跑，享受原生调试与秒级热重载；
#     容器只负责那些"装起来麻烦、又不该在本机留痕"的东西。
#
# 用法：
#   docker compose -f docker-compose.dev.yml up -d
#   cp .env.example .env          # 然后按下文把 URL 指向 localhost
#   .venv/Scripts/python -m uvicorn reelagent_cloud.api.app:app --reload   # Windows
#   reelagent-server --reload                                              # *nix
#   reelagent-worker                                                       # 另开一个终端
#
# 宿主侧需要设置的三个变量（.env 里换成下面这份）：
#   REEL_DATABASE__URL=postgresql+asyncpg://reelagent:reelagent@localhost:5432/reelagent
#   REEL_REDIS__URL=redis://:reelagent-dev@localhost:6379/0
#   REEL_REDIS__ENABLED=true
#
# 这里的默认口令是**开发专用**、写在明面上的；生产编排（docker-compose.yml）
# 反过来，任何口令缺失都会直接报错退出。
# ============================================================================
name: reelagent-dev

services:
  # ------------------------------------------------------------------ #
  postgres:
    image: postgres:16-alpine
    container_name: reelagent-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reelagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reelagent}
      POSTGRES_DB: ${POSTGRES_DB:-reelagent}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
      # 开发期把慢查询/连接日志打全，方便早期发现 N+1
      POSTGRES_LOG_MIN_DURATION_STATEMENT: "200"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    container_name: reelagent-dev-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-reelagent-dev}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-reelagent-dev}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ------------------------------------------------------------------ #
  # MinIO：本地验证 storage.backend=s3 分支用的 S3 兼容服务。
  # 只在显式启用 profile 时启动，避免"只是想跑 SQLite 快速开发"的人
  # 也被迫多拉两个镜像：
  #     docker compose -f docker-compose.dev.yml --profile s3 up -d
  # ------------------------------------------------------------------ #
  minio:
    image: minio/minio:latest
    container_name: reelagent-dev-minio
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reelagent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reelagent-dev}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata_dev:/data
    healthcheck:
      # minio/minio 镜像自带 mc，所以直接用 `mc ready`；
      # 万一将来基础镜像去掉 mc，改用 HTTP 探针即可：
      #   test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 建桶：MinIO 起来后自动创建 reelagent 桶并设为可下载，
  # 省掉"第一次上传报 NoSuchBucket，翻文档找 mc 命令"的十分钟
  minio-init:
    image: minio/mc:latest
    container_name: reelagent-dev-minio-init
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reelagent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reelagent-dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$${MINIO_BUCKET:-reelagent} &&
      mc anonymous set download local/$${MINIO_BUCKET:-reelagent} &&
      echo '[minio-init] 桶已就绪'
      "
    restart: "no"

volumes:
  pgdata_dev:
  redisdata_dev:
  miniodata_dev:
