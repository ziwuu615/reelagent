# ============================================================================
# ReelAgent 密钥（示例模板 —— 真实值**不要**提交到 Git）
#
# 用法（二选一）：
#   A. 直接用 kubectl 创建（推荐，密钥不落盘）：
#        kubectl create secret generic reelagent-secrets -n reelagent \
#          --from-literal=REEL_SECURITY__SECRET_KEY="$(openssl rand -base64 48)" \
#          --from-literal=REEL_SECURITY__API_KEY_PEPPER="$(openssl rand -base64 48)" \
#          --from-literal=REEL_DATABASE__URL="postgresql+asyncpg://reelagent:口令@db:5432/reelagent" \
#          --from-literal=REEL_REDIS__URL="redis://:口令@redis:6379/0" \
#          --from-literal=REEL_PROVIDERS__VIDEO__API_KEY="..." \
#          --from-literal=REEL_PROVIDERS__IMAGE__API_KEY="..." \
#          --from-literal=REEL_PROVIDERS__LLM__API_KEY="..." \
#          --from-literal=REEL_PROVIDERS__TTS__API_KEY="..." \
#          --from-literal=REEL_BILLING__SECRET_KEY="sk_live_..." \
#          --from-literal=REEL_BILLING__WEBHOOK_SECRET="whsec_..."
#
#   B. 生产环境建议用 External Secrets Operator / Sealed Secrets /
#      Vault Agent 注入，把密钥源头放在密码管理服务里，K8s 里只留引用。
#      本文件仅用于本地 kind/minikube 演练。
#
# 说明：用 stringData 而不是 data —— 前者写明文、由 apiserver 负责 base64，
#      人工维护时不容易写错；真正的 at-rest 加密由 etcd encryption 负责。
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: reelagent-secrets
  namespace: reelagent
  labels:
    app.kubernetes.io/name: reelagent
    app.kubernetes.io/part-of: reelagent
type: Opaque
stringData:
  # ---- 会话安全：生成方式 `openssl rand -base64 48` 或
  #      `python -c "import secrets;print(secrets.token_urlsafe(48))"` ----
  REEL_SECURITY__SECRET_KEY: "CHANGE_ME_48字节随机串"
  REEL_SECURITY__API_KEY_PEPPER: "CHANGE_ME_另一个独立的48字节随机串"

  # ---- 数据库 / Redis：口令在 URL 里，因此必须放 Secret ----
  # 集群内连托管数据库时记得按需加 ?ssl=require
  REEL_DATABASE__URL: "postgresql+asyncpg://reelagent:CHANGE_ME@postgres.reelagent.svc.cluster.local:5432/reelagent"
  REEL_REDIS__URL: "redis://:CHANGE_ME@redis.reelagent.svc.cluster.local:6379/0"

  # ---- 供应商 Key（生产校验要求视频 Key 必须存在）----
  REEL_PROVIDERS__LLM__API_KEY: "CHANGE_ME"
  REEL_PROVIDERS__IMAGE__API_KEY: "CHANGE_ME"
  REEL_PROVIDERS__VIDEO__API_KEY: "CHANGE_ME"
  REEL_PROVIDERS__TTS__API_KEY: "CHANGE_ME"

  # ---- 对象存储（仅 backend=s3 时需要）----
  REEL_STORAGE__S3_ACCESS_KEY_ID: ""
  REEL_STORAGE__S3_SECRET_ACCESS_KEY: ""

  # ---- Stripe（仅 billing.enabled=true 时需要）----
  REEL_BILLING__SECRET_KEY: "sk_live_CHANGE_ME"
  REEL_BILLING__WEBHOOK_SECRET: "whsec_CHANGE_ME"
  REEL_BILLING__PUBLISHABLE_KEY: "pk_live_CHANGE_ME"

  # ---- 邮件（可选）----
  REEL_EMAIL__PASSWORD: ""
  # ---- 监控（可选）----
  REEL_OBSERVABILITY__SENTRY_DSN: ""
