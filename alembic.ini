# Alembic configuration.
#
# NOTE: This file is intentionally ASCII-only.
# Alembic reads alembic.ini with `encoding="locale"`, which on Chinese Windows
# resolves to GBK -- non-ASCII comments here would crash `alembic upgrade`
# with UnicodeDecodeError. Keep all comments in this file in English.
# (Python migration files are read as UTF-8, so Chinese is fine there.)
#
# The real connection string is NOT defined here: it is injected by
# `reelagent_cloud/db/migrations/env.py` from application settings
# (REEL_DATABASE__URL), so there is a single source of truth and migrations
# can never run against the wrong database.
[alembic]
script_location = reelagent_cloud/db/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

# Timestamp-prefixed revision filenames keep chronological ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No post-write hook on purpose.
# `ruff` on PyPI ships a prebuilt binary and does NOT register a
# console_scripts entry point, so `type = console_scripts` always fails.
# Formatting is enforced by `ruff format --check` in CI instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
